<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f172a" />
<meta name="mobile-web-app-capable" content="yes" />
<title>Snake</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" href="icons/icon-192.png" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #0f172a;
    color: #e2e8f0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: max(12px, env(safe-area-inset-top)) 12px max(16px, env(safe-area-inset-bottom));
    touch-action: none;
  }
  header {
    width: min(92vw, 480px);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  h1 { font-size: 26px; letter-spacing: 3px; color: #4ade80; }
  .stats { display: flex; gap: 18px; font-size: 13px; color: #94a3b8; }
  .stats div { text-align: center; }
  .stats b { display: block; font-size: 22px; color: #f8fafc; }

  .board {
    position: relative;
    width: min(92vw, 480px, 52vh);
    aspect-ratio: 1;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 12px;
    background: #1e293b;
    box-shadow: 0 0 0 2px #334155;
  }
  .overlay {
    position: absolute;
    inset: 0;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 20px;
    text-align: center;
    background: rgba(15, 23, 42, 0.75);
  }
  .overlay.hidden { display: none; }
  .overlay h2 { font-size: 24px; }
  .overlay p { font-size: 15px; color: #94a3b8; }

  .pad {
    display: grid;
    grid-template-columns: repeat(3, 60px);
    grid-template-rows: repeat(3, 60px);
    grid-template-areas: ". up ." "left . right" ". down .";
    gap: 8px;
  }
  .pad button {
    border: none;
    border-radius: 16px;
    background: #334155;
    color: #f8fafc;
    font-size: 22px;
    cursor: pointer;
  }
  .pad button:active { background: #4ade80; color: #0f172a; }
  .up { grid-area: up; }
  .down { grid-area: down; }
  .left { grid-area: left; }
  .right { grid-area: right; }
</style>
</head>
<body>

<header>
  <h1>Nyoka yaAnto</h1>
  <div class="stats">
    <div>Score<b id="score">0</b></div>
    <div>Best<b id="best">0</b></div>
  </div>
</header>

<div class="board" id="board">
  <canvas id="game"></canvas>
  <div class="overlay" id="overlay">
    <h2 id="title">Ready?</h2>
    <p id="msg">Swipe or tap a button to start</p>
  </div>
</div>

<div class="pad">
  <button class="up" data-x="0" data-y="-1" aria-label="Up">▲</button>
  <button class="left" data-x="-1" data-y="0" aria-label="Left">◀</button>
  <button class="right" data-x="1" data-y="0" aria-label="Right">▶</button>
  <button class="down" data-x="0" data-y="1" aria-label="Down">▼</button>
</div>

<script>
const COLS = 20;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const boardEl = document.getElementById('board');
const overlay = document.getElementById('overlay');
const titleEl = document.getElementById('title');
const msgEl = document.getElementById('msg');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');

let best = Number(localStorage.getItem('snake-best')) || 0;
bestEl.textContent = best;

let size = 0, cell = 0;
let snake, dir, queue, food, score, state, timer;
let touchStart = null;

const KEYS = {
  ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
  w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0],
  W: [0, -1], S: [0, 1], A: [-1, 0], D: [1, 0]
};

function resize() {
  const dpr = window.devicePixelRatio || 1;
  size = boardEl.clientWidth;
  canvas.width = Math.round(size * dpr);
  canvas.height = Math.round(size * dpr);
  const scale = canvas.width / size;
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  cell = size / COLS;
  draw();
}

function placeFood() {
  do {
    food = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * COLS) };
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function showOverlay(title, msg) {
  titleEl.textContent = title;
  msgEl.textContent = msg;
  overlay.classList.remove('hidden');
}

function hideOverlay() {
  overlay.classList.add('hidden');
}

function reset() {
  clearTimeout(timer);
  const m = COLS >> 1;
  snake = [{ x: m, y: m }, { x: m - 1, y: m }, { x: m - 2, y: m }];
  dir = { x: 1, y: 0 };
  queue = [];
  score = 0;
  scoreEl.textContent = '0';
  placeFood();
  state = 'ready';
  showOverlay('Ready?', 'Swipe or tap a button to start');
  draw();
}

function start() {
  state = 'running';
  hideOverlay();
  schedule();
}

function schedule() {
  clearTimeout(timer);
  timer = setTimeout(tick, Math.max(60, 140 - score * 3));
}

function tick() {
  if (state !== 'running') return;
  step();
  draw();
  if (state === 'running') schedule();
}

function step() {
  if (queue.length) dir = queue.shift();
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  const hitWall = head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= COLS;
  const hitSelf = snake.some(s => s.x === head.x && s.y === head.y);
  if (hitWall || hitSelf) return gameOver();

  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score++;
    scoreEl.textContent = score;
    placeFood();
  } else {
    snake.pop();
  }
}

function gameOver() {
  state = 'over';
  clearTimeout(timer);
  if (score > best) {
    best = score;
    localStorage.setItem('snake-best', best);
    bestEl.textContent = best;
  }
  showOverlay('Game Over', `Score: ${score}. Tap or press Space to play again`);
}

function turn(x, y) {
  if (state === 'over') { reset(); return; }
  const last = queue.length ? queue[queue.length - 1] : dir;
  const opposite = x === -last.x && y === -last.y;
  const same = x === last.x && y === last.y;
  if (!opposite && !same && queue.length < 3) queue.push({ x, y });
  if (state !== 'running') start();
}

function draw() {
  if (!snake) return;
  ctx.fillStyle = '#1e293b';
  ctx.fillRect(0, 0, size, size);

  ctx.fillStyle = '#ef4444';
  ctx.beginPath();
  ctx.arc((food.x + 0.5) * cell, (food.y + 0.5) * cell, cell * 0.36, 0, Math.PI * 2);
  ctx.fill();

  const pad = cell * 0.08;
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#4ade80' : '#22c55e';
    ctx.fillRect(s.x * cell + pad, s.y * cell + pad, cell - pad * 2, cell - pad * 2);
  });
}

// Keyboard
document.addEventListener('keydown', e => {
  if (KEYS[e.key]) {
    e.preventDefault();
    turn(...KEYS[e.key]);
  } else if (e.key === ' ' || e.key === 'Enter') {
    e.preventDefault();
    if (state === 'over') reset();
    else if (state !== 'running') start();
  }
});

// Swipe and tap on the board
boardEl.addEventListener('pointerdown', e => {
  touchStart = { x: e.clientX, y: e.clientY };
});
boardEl.addEventListener('pointerup', e => {
  if (!touchStart) return;
  const dx = e.clientX - touchStart.x;
  const dy = e.clientY - touchStart.y;
  touchStart = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) {
    if (state === 'over') reset();
    else if (state !== 'running') start();
    return;
  }
  if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0);
  else turn(0, dy > 0 ? 1 : -1);
});
boardEl.addEventListener('pointercancel', () => { touchStart = null; });

// On-screen D-pad
document.querySelectorAll('.pad button').forEach(btn => {
  btn.addEventListener('pointerdown', e => {
    e.preventDefault();
    turn(Number(btn.dataset.x), Number(btn.dataset.y));
  });
});

// Pause when the app goes to background
document.addEventListener('visibilitychange', () => {
  if (document.hidden && state === 'running') {
    clearTimeout(timer);
    state = 'paused';
    showOverlay('Paused', 'Tap or press a direction to resume');
  }
});

window.addEventListener('resize', resize);

resize();
reset();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
